          <div class="input-group">
            <input type="text" placeholder="Year">
          </div>

      </div>

      <div class="input-group">
        <select>
            <option value="" disabled selected hidden>Gender</option>
            <option>Female</option>
            <option>Male</option>
            <option>Rather not say</option>
            <option>Custom</option>
          </select>
      </div>

      <p class="why-link">
